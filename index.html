<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scanner — ระบบจัดการสินค้าส่งคืน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root {
  --bg: #5a0010;
  --red: #c0172b;
  --red-light: #e8203a;
  --red-glow: rgba(192,23,43,0.55);
  --glass: rgba(255,255,255,0.10);
  --glass-bd: rgba(255,255,255,0.20);
  --text-w: #ffffff;
  --text-ws: rgba(255,255,255,0.75);
  --text-wm: rgba(255,255,255,0.55);
  --font-display: 'Prompt', sans-serif;
  --font-body: 'Prompt', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text-w);
  font-family: var(--font-body);
  overflow: hidden;
  position: relative;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(ellipse at top, rgba(220,38,38,0.35), transparent 50%),
    radial-gradient(ellipse at bottom, rgba(127,29,29,0.40), transparent 60%);
  z-index: 0;
  pointer-events: none;
}

.app {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  padding: 0;
}

.scan-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 18px;
  background: rgba(40,0,8,0.50);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--glass-bd);
}
.scan-header .title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.scan-header .title small {
  display: block;
  font-size: 10px;
  font-weight: 500;
  color: var(--text-ws);
  margin-top: 2px;
  letter-spacing: 0.04em;
}
.scan-header .close-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: rgba(255,255,255,0.10);
  border: 1px solid var(--glass-bd);
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all .15s;
}
.scan-header .close-btn:hover {
  background: rgba(255,255,255,0.20);
  transform: scale(1.05);
}

.scan-body {
  flex: 1;
  position: relative;
  background: #000;
  overflow: hidden;
}
#reader { width: 100%; height: 100%; }
#reader video {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover;
}
#reader__dashboard,
#reader__dashboard_section_csr,
#reader__header_message,
#reader__scan_region img,
#reader__scan_region__zoom_slider { display: none !important; }

.scan-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  display: grid;
  place-items: center;
  background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.55) 70%);
}
.scan-frame {
  width: 96%;
  max-width: 700px;
  aspect-ratio: 1.5;  /* wider rectangle รองรับ barcode ทุกแนว */
  border: 2.5px solid transparent;
  position: relative;
  border-radius: 28px;
}
.scan-corner {
  position: absolute;
  width: 56px;
  height: 56px;
  border: 6px solid #4ade80;
  filter: drop-shadow(0 0 16px rgba(74,222,128,0.95));
}
.scan-corner.tl { top: -3px; left: -3px; border-right: none; border-bottom: none; border-radius: 16px 0 0 0; }
.scan-corner.tr { top: -3px; right: -3px; border-left: none; border-bottom: none; border-radius: 0 16px 0 0; }
.scan-corner.bl { bottom: -3px; left: -3px; border-right: none; border-top: none; border-radius: 0 0 0 16px; }
.scan-corner.br { bottom: -3px; right: -3px; border-left: none; border-top: none; border-radius: 0 0 16px 0; }
.scan-line {
  position: absolute;
  top: 0;
  left: 12px;
  right: 12px;
  height: 3px;
  background: linear-gradient(90deg, transparent, #4ade80, transparent);
  filter: blur(1px);
  animation: scan-sweep 1.5s ease-in-out infinite;
  border-radius: 99px;
  box-shadow: 0 0 14px #4ade80;
}
@keyframes scan-sweep {
  0%, 100% { top: 10px; }
  50% { top: calc(100% - 14px); }
}

.scan-loading {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(0,0,0,0.85);
  color: #fff;
  z-index: 10;
  text-align: center;
}
.spinner {
  width: 50px;
  height: 50px;
  border: 4px solid rgba(255,255,255,0.20);
  border-top-color: var(--red-light);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.scan-footer {
  padding: 16px;
  background: rgba(40,0,8,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--glass-bd);
}

.manual-input {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.manual-input input {
  flex: 1;
  background: var(--glass);
  border: 1px solid var(--glass-bd);
  border-radius: 12px;
  padding: 12px 14px;
  color: #fff;
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  outline: none;
}
.manual-input input::placeholder { color: var(--text-wm); font-family: var(--font-body); font-weight: 500; }
.manual-input input:focus {
  border-color: var(--red-light);
  background: rgba(255,255,255,0.15);
  box-shadow: 0 0 0 3px rgba(232,32,58,0.20);
}
.manual-input button {
  background: var(--red);
  border: 1px solid var(--red-light);
  border-radius: 12px;
  color: #fff;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 13px;
  padding: 0 18px;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.manual-input button:hover {
  background: var(--red-light);
  box-shadow: 0 4px 14px var(--red-glow);
}

.hint {
  text-align: center;
  font-size: 11px;
  color: var(--text-wm);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.result-banner {
  position: absolute;
  top: 50%;
  left: 20px;
  right: 20px;
  transform: translateY(-50%) scale(0.9);
  background: rgba(74,222,128,0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 2px solid #fff;
  border-radius: 18px;
  padding: 24px 20px;
  color: #064e3b;
  text-align: center;
  opacity: 0;
  transition: all .3s cubic-bezier(.4,0,.2,1);
  pointer-events: none;
  z-index: 100;
  box-shadow: 0 12px 40px rgba(0,0,0,0.40);
}
.result-banner.show {
  opacity: 1;
  transform: translateY(-50%) scale(1);
}
.result-banner .icon { font-size: 36px; margin-bottom: 8px; }
.result-banner .label {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}
.result-banner .code {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 700;
  word-break: break-all;
  margin-bottom: 4px;
}
.result-banner small { font-size: 11px; opacity: 0.8; }
</style>
</head>
<body>
<div class="app">
  <header class="scan-header">
    <div class="title">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
      <div>สแกนเลขพัสดุ<small>QR Code · Barcode · Code128</small></div>
    </div>
    <button class="close-btn" onclick="closeWindow()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </header>
  
  <div class="scan-body">
    <div id="reader"></div>
    <div class="scan-overlay">
      <div class="scan-frame">
        <div class="scan-corner tl"></div>
        <div class="scan-corner tr"></div>
        <div class="scan-corner bl"></div>
        <div class="scan-corner br"></div>
        <div class="scan-line"></div>
      </div>
    </div>
    <div class="scan-loading" id="loadingEl">
      <div>
        <div class="spinner"></div>
        <div style="font-weight:600;">กำลังเปิดกล้อง...</div>
        <small style="opacity:.7;display:block;margin-top:6px;">กรุณาอนุญาตการใช้กล้อง</small>
      </div>
    </div>
    <div class="result-banner" id="resultBanner">
      <div class="icon">✓</div>
      <div class="label">สแกนสำเร็จ</div>
      <div class="code" id="resultCode"></div>
      <small>กำลังส่งกลับ...</small>
    </div>
  </div>
  
  <footer class="scan-footer">
    <div class="manual-input">
      <input type="text" id="manualInput" placeholder="หรือกรอกเลขพัสดุด้วยมือ..." autocomplete="off">
      <button onclick="submitManual()">ส่ง</button>
    </div>
    <div class="hint">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      จัดให้ QR/Barcode อยู่ในกรอบสีเขียว — สแกนเสร็จระบบจะส่งกลับอัตโนมัติ
    </div>
  </footer>
</div>

<script>
let html5QrCode = null;
let isScanning = false;

async function startScanner() {
  try {
    html5QrCode = new Html5Qrcode("reader", {
      // รองรับ barcode รูปแบบต่าง ๆ ที่ใช้บ่อยกับพัสดุไทย
      formatsToSupport: [
        Html5QrcodeSupportedFormats.CODE_128,    // FLASH, SPX, J&T
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.CODE_93,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.ITF,          // SPX, LEX
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODABAR,
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.DATA_MATRIX,
        Html5QrcodeSupportedFormats.PDF_417,
      ],
      // ใช้ native BarcodeDetector API ที่เร็วกว่ามาก (Chrome/Edge บนมือถือรองรับ)
      useBarCodeDetectorIfSupported: true,
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }
    });
    
    // คำนวณขนาด qrbox ใหญ่ขึ้น — ครอบคลุมพื้นที่กว้างเพื่อรองรับโฟกัสไม่ชัด/บาร์โค้ดเอียง
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const qrboxWidth = Math.min(Math.floor(vw * 0.92), 720);
    const qrboxHeight = Math.floor(qrboxWidth * 0.65);  // 1.5:1 aspect ratio (wider)
    
    await html5QrCode.start(
      { facingMode: "environment" },
      {
        fps: 30,  // เพิ่มเป็น 30 fps สแกนเร็วขึ้นมาก
        qrbox: { width: qrboxWidth, height: qrboxHeight },
        aspectRatio: 1.5,
        disableFlip: false,
        rememberLastUsedCamera: true,
        // ปรับ video constraints รองรับโฟกัสไม่ชัด + macro mode + zoom
        videoConstraints: {
          facingMode: { ideal: "environment" },
          width: { ideal: 2560, min: 1280 },   // ความละเอียดสูงขึ้น = ชัดขึ้นเมื่อโฟกัสไม่ตรง
          height: { ideal: 1440, min: 720 },
          frameRate: { ideal: 30, min: 15 },
          focusMode: { ideal: "continuous" },
          // ลำดับ priorities สำหรับ camera ที่โฟกัสไม่แม่นยำ
          advanced: [
            { focusMode: "continuous" },
            { exposureMode: "continuous" },
            { whiteBalanceMode: "continuous" },
            { focusDistance: { ideal: 0.05, min: 0 } },  // macro - ใกล้มาก
            { focusDistance: { ideal: 0.3 } },           // ปกติ
            { focusDistance: { ideal: 1.0 } },           // ไกล
            { zoom: 1.5 },                                // zoom in เล็กน้อย รองรับ barcode เล็ก
            { iso: { ideal: 400 } }                       // ISO สูงขึ้นสำหรับที่แสงน้อย
          ]
        }
      },
      onScanSuccess,
      () => {}
    );
    isScanning = true;
    document.getElementById('loadingEl').style.display = 'none';
    
    // ลองเปิด torch (flashlight) อัตโนมัติเป็น hint (user ปิดได้)
    try {
      const track = html5QrCode.getRunningTrackCameraCapabilities();
      if (track && track.torchFeature && track.torchFeature().isSupported()) {
        // มี torch — เพิ่มปุ่ม
        showTorchButton();
      }
    } catch (e) { /* skip */ }
  } catch (err) {
    document.getElementById('loadingEl').innerHTML = 
      '<div style="color:#fca5a5;text-align:center;">' +
      '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:block;margin:0 auto 14px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
      '<div style="font-weight:700;font-size:15px;margin-bottom:6px;">ไม่สามารถเปิดกล้องได้</div>' +
      '<small style="opacity:.75;display:block;margin-bottom:14px;">' + (err.message || err) + '</small>' +
      '<small style="opacity:.6;">ลองกรอกเลขพัสดุด้านล่างแทน</small>' +
      '</div>';
  }
}

function showTorchButton() {
  let torchBtn = document.getElementById('torchBtn');
  if (torchBtn) return;
  torchBtn = document.createElement('button');
  torchBtn.id = 'torchBtn';
  torchBtn.style.cssText = 'position:fixed;bottom:140px;right:14px;width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,0.65);border:1px solid rgba(255,255,255,0.30);color:#fff;display:grid;place-items:center;cursor:pointer;z-index:60;backdrop-filter:blur(10px);';
  torchBtn.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H8L6 8h12l-2-6z"/><path d="M9 8v4l3 7 3-7V8"/></svg>';
  let on = false;
  torchBtn.onclick = async () => {
    try {
      on = !on;
      const track = html5QrCode.getRunningTrackCameraCapabilities();
      if (track && track.torchFeature) {
        await track.torchFeature().apply(on);
        torchBtn.style.background = on ? 'rgba(251,191,36,0.55)' : 'rgba(0,0,0,0.65)';
      }
    } catch (e) {}
  };
  document.body.appendChild(torchBtn);
}

// ============ BEEP SOUND (Web Audio API) ============
let audioCtx = null;
function playBeep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const now = audioCtx.currentTime;
    
    // เสียง "ติ๊ด" แบบเครื่องอ่าน barcode (1000Hz beep สั้น)
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1000, now);
    osc.frequency.setValueAtTime(1500, now + 0.05);  // pitch up เล็กน้อย
    
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.35, now + 0.01);  // quick attack
    gain.gain.setValueAtTime(0.35, now + 0.10);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);  // decay
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.15);
  } catch (err) {
    console.warn('Beep failed:', err);
  }
}

function onScanSuccess(decoded) {
  if (!isScanning) return;
  isScanning = false;
  
  // 🔊 เสียงติ๊ด เมื่อสแกนผ่าน
  playBeep();
  
  // แสดง banner
  document.getElementById('resultCode').textContent = decoded;
  document.getElementById('resultBanner').classList.add('show');
  
  // Vibrate
  if (navigator.vibrate) navigator.vibrate([60, 30, 60]);
  
  // Send to opener
  sendToOpener(decoded);
  
  // Stop camera and close after 1.2s
  setTimeout(() => {
    if (html5QrCode) {
      html5QrCode.stop().catch(() => {});
    }
    setTimeout(() => closeWindow(), 200);
  }, 1200);
}

function sendToOpener(value) {
  if (window.opener && !window.opener.closed) {
    try {
      window.opener.postMessage({ type: 'scan-result', value: String(value).trim() }, '*');
    } catch (e) {
      console.error(e);
    }
  }
}

function submitManual() {
  const val = document.getElementById('manualInput').value.trim();
  if (!val) return;
  sendToOpener(val);
  document.getElementById('resultCode').textContent = val;
  document.getElementById('resultBanner').classList.add('show');
  setTimeout(closeWindow, 1000);
}

function closeWindow() {
  if (html5QrCode && isScanning) {
    html5QrCode.stop().catch(() => {});
  }
  window.close();
  // ถ้า close ไม่ได้ (เปิดในแท็บปกติ ไม่ใช่ popup)
  setTimeout(() => {
    document.body.innerHTML = '<div style="padding:40px 20px;text-align:center;color:#fff;font-family:sans-serif;"><div style="font-size:48px;margin-bottom:16px;">✓</div><div style="font-size:18px;font-weight:700;">เสร็จแล้ว</div><div style="opacity:.6;margin-top:10px;font-size:13px;">คุณสามารถปิดแท็บนี้ได้</div></div>';
  }, 300);
}

// Manual input - Enter key
document.getElementById('manualInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submitManual();
});

// Start camera on page load
window.addEventListener('DOMContentLoaded', startScanner);
</script>
</body>
</html>
